<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>PREVIEW · .design 8s wave</title>
  <link rel="stylesheet" href="../core.css?v=20261111-39">
  <style>
    /* ==========================================================
       PREVIEW (12 Nov 2026): the Studio dot wave, drawn with the Participa 8 for .design.
       The Studio dot wave exactly (grid 20, same timing), with the full-size .design 8 in place of the dot,
       set along the diagonal the wave travels on, white at 40%. (First try: 8s at 60% on a grid of 14 felt too small.)
       Hover (computer) or scroll into view (phone): one wave crosses the card from a corner to the
       opposite side; each 8 grows to full size as the wave passes, then shrinks away, and the
       image is clear again. Same timing as the live Studio dots (js/sdots.js, css/home.css).
       Test switches: ?step=14 (grid, in units of a 300 x 200 card), ?size=0.6 (8 size), ?corner=tl|tr|bl|br.
       ========================================================== */
    body { margin: 0; font-family: var(--font-body); color: var(--colour-ink); background: #73D4DC; }
    .sheet { padding: 3rem var(--inset); }
    .sheet h2 { margin: 0 0 0.5rem; font-size: 0.8125rem; letter-spacing: 0.16em; text-transform: uppercase; }
    .sheet p { margin: 0 0 1.5rem; max-width: 40rem; font-size: 1rem; line-height: 1.5; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2rem; }
    @media (max-width: 720px) { .cards { grid-template-columns: 1fr; } }

    .w8 { position: relative; display: block; overflow: hidden; aspect-ratio: 3 / 2; transition: transform 0.3s ease; }
    .w8:hover { transform: translateY(-4px); }
    .w8 img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .w8 svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .w8 g g {
      fill: #fff;
      opacity: 0.4;                      /* white at 40%, as the markers and caption bands */
      transform-box: fill-box; transform-origin: center;
      transform: scale(0);
    }
    .w8.is-on g g { animation: w8-wave 1.1s var(--d, 0ms) both; }
    @keyframes w8-wave {
      0%   { transform: scale(0); animation-timing-function: cubic-bezier(.3, 1.3, .5, 1); }   /* grow, small bounce */
      40%  { transform: scale(1); animation-timing-function: cubic-bezier(.5, 0, .7, .4); }    /* then shrink away */
      100% { transform: scale(0); }
    }
    @media (prefers-reduced-motion: reduce) { .w8 svg { display: none; } }
  </style>
</head>
<body>
<section class="sheet">
  <h2>.design · 8s wave (test)</h2>
  <p>Hover over a card: one wave of 8s crosses the photo from a corner to the opposite side, then the photo is clear again. On a phone, a wave runs each time a card scrolls into view.</p>
  <div class="cards">
    <a class="w8" href="#" data-corner="tl"><img src="https://participa.design/images/placeholders/placeholder-01.jpg" alt=""></a>
    <a class="w8" href="#" data-corner="br"><img src="https://participa.design/images/placeholders/placeholder-02.jpg" alt=""></a>
    <a class="w8" href="#" data-corner="tr"><img src="https://participa.design/images/placeholders/placeholder-03.jpg" alt=""></a>
    <a class="w8" href="#" data-corner="bl"><img src="https://participa.design/images/placeholders/placeholder-04.jpg" alt=""></a>
    <a class="w8" href="#" data-corner="tr"><img src="https://participa.design/images/placeholders/placeholder-05.jpg" alt=""></a>
    <a class="w8" href="#" data-corner="tl"><img src="https://participa.design/images/placeholders/placeholder-06.jpg" alt=""></a>
  </div>
</section>
<script>
  (function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var NS = "http://www.w3.org/2000/svg", W = 300, H = 200, SWEEP = 900;
    var params = new URLSearchParams(location.search);
    var STEP = parseFloat(params.get("step")) || 20;                // the same grid as the Studio dots
    var SIZE = parseFloat(params.get("size")) || 1;                 // the full .design 8 (as in goo.js)
    var FIXED = params.get("corner");
    var hoverable = window.matchMedia("(hover: hover)").matches;

    function play(card) { card.classList.remove("is-on"); void card.offsetWidth; card.classList.add("is-on"); }

    document.querySelectorAll(".w8").forEach(function (card) {
      var corner = FIXED || card.getAttribute("data-corner") || "tl";
      var cx = corner.indexOf("r") > -1 ? W : 0, cy = corner.indexOf("b") > -1 ? H : 0;
      // the 8 lies along the diagonal the wave travels on: two dots and a neck, drawn round (0,0)
      var o = 4.5 * SIZE, r = 4.6 * SIZE, n = 2.6 * SIZE / Math.SQRT2;
      var a = (cx === 0) === (cy === 0) ? [-o, -o, o, o] : [o, -o, -o, o];
      var sx = Math.sign(a[0] - a[2]), sy = Math.sign(a[1] - a[3]);
      var neck = [[a[0] - n * sy, a[1] + n * sx], [a[2] - n * sy, a[3] + n * sx], [a[2] + n * sy, a[3] - n * sx], [a[0] + n * sy, a[1] - n * sx]]
        .map(function (q) { return q[0].toFixed(2) + "," + q[1].toFixed(2); }).join(" ");
      var mark = '<circle cx="' + a[0].toFixed(2) + '" cy="' + a[1].toFixed(2) + '" r="' + r.toFixed(2) + '"/><circle cx="' + a[2].toFixed(2) + '" cy="' + a[3].toFixed(2) + '" r="' + r.toFixed(2) + '"/><polygon points="' + neck + '"/>';

      var maxD = Math.hypot(W, H), html = "";
      for (var y = STEP / 2; y < H + STEP; y += STEP) {
        for (var x = STEP / 2; x < W + STEP; x += STEP) {
          var t = Math.min(1, Math.hypot(x - cx, y - cy) / maxD);    // 0 at the corner, 1 at the far corner
          html += '<g transform="translate(' + x + ' ' + y + ')"><g style="--d:' + Math.round(t * SWEEP) + 'ms">' + mark + '</g></g>';
        }
      }
      var svg = document.createElementNS(NS, "svg");
      svg.setAttribute("viewBox", "0 0 " + W + " " + H);
      svg.setAttribute("preserveAspectRatio", "xMidYMid slice");
      svg.setAttribute("aria-hidden", "true");
      svg.innerHTML = html;
      card.appendChild(svg);

      card.addEventListener("click", function (e) { e.preventDefault(); play(card); });   // tap or click: replay
      if (hoverable) card.addEventListener("pointerenter", function () { play(card); });
      else if ("IntersectionObserver" in window) {
        new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) play(e.target); }); }, { threshold: 0.6 }).observe(card);
      }
    });
  })();
</script>
</body>
</html>
